<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Assignment 01 - Nguyễn Trí Dũng</title>
    <style>
        /* Import font chữ hiện đại từ Google Fonts */
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Quicksand:wght@400;600;700&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        /* Nền chuyển màu động (Animated Gradient) */
        body {
            font-family: 'Quicksand', sans-serif;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background: linear-gradient(-45deg, #1a2a6c, #b21f1f, #fdbb2d, #1a2a6c);
            background-size: 400% 400%;
            animation: gradientBG 15s ease infinite;
            color: #ffffff;
            overflow: hidden;
        }

        @keyframes gradientBG {
            0% { background-position: 0% 50%; }
            50% { background-position: 100% 50%; }
            100% { background-position: 0% 50%; }
        }

        /* Hiệu ứng thẻ kính mờ (Glassmorphism) */
        .glass-card {
            position: relative;
            z-index: 1;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 24px;
            padding: 40px;
            width: 90%;
            max-width: 600px;
            box-shadow: 0 25px 45px rgba(0, 0, 0, 0.2);
            transform: translateY(0);
            transition: transform 0.4s ease, box-shadow 0.4s ease;
        }

        .glass-card:hover {
            transform: translateY(-10px);
            box-shadow: 0 30px 60px rgba(0, 0, 0, 0.4);
        }

        .header {
            text-align: center;
            margin-bottom: 35px;
        }

        .header h1 {
            font-family: 'Orbitron', sans-serif;
            font-size: 2.2rem;
            letter-spacing: 2px;
            text-transform: uppercase;
            margin-bottom: 10px;
            color: #fff;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.5), 0 0 20px rgba(0, 255, 204, 0.5);
        }

        .header p {
            font-size: 1.1rem;
            color: #d1d1d1;
            font-weight: 600;
            letter-spacing: 1px;
        }

        .info-table {
            width: 100%;
            border-collapse: separate;
            border-spacing: 0 12px;
        }

        .info-row {
            background: rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .info-row:hover {
            background: rgba(255, 255, 255, 0.15);
            transform: scale(1.03);
            box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
        }

        .info-row td {
            padding: 16px 20px;
            border: 1px solid rgba(255, 255, 255, 0.05);
        }

        .info-row td:first-child {
            border-radius: 12px 0 0 12px;
            font-weight: 700;
            color: #a8e6cf;
            width: 35%;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .info-row td:last-child {
            border-radius: 0 12px 12px 0;
            font-size: 1.1rem;
            font-weight: 600;
        }

        .highlight {
            color: #ff8a00;
            text-shadow: 0 0 5px rgba(255, 138, 0, 0.5);
        }

        a {
            color: #00ffcc;
            text-decoration: none;
            transition: color 0.3s ease;
        }

        a:hover {
            color: #ffffff;
            text-shadow: 0 0 8px #00ffcc;
        }

        .footer {
            margin-top: 35px;
            text-align: center;
            font-size: 0.95rem;
            color: #b3b3b3;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
            padding-top: 20px;
            display: flex;
            justify-content: space-between;
            font-family: 'Orbitron', sans-serif;
            letter-spacing: 1px;
        }
    </style>
</head>
<body>
    <div class="glass-card">
        <div class="header">
            <h1>Nguyễn Trí Dũng</h1>
            <p>Trường Công nghệ Thông tin và Truyền thông</p>
        </div>
        
        <table class="info-table">
            <tr class="info-row">
                <td>MSSV</td>
                <td class="highlight">20235053</td>
            </tr>
            <tr class="info-row">
                <td>Bài tập</td>
                <td>Assignment 01</td>
            </tr>
            <tr class="info-row">
                <td>Học kỳ</td>
                <td>Kỳ 20261</td>
            </tr>
            <tr class="info-row">
                <td>Tên miền</td>
                <td><a href="https://ntdungmegaz.id.vn" target="_blank">ntdungmegaz.id.vn</a></td>
            </tr>
        </table>

        <div class="footer">
            <span>SOICT</span>
            <span>ĐHBK HÀ NỘI</span>
        </div>
    </div>
</body>
</html>
